    if(ia) ia.addEventListener('input',function(){ a=parseFloat(ia.value); draw(); });
    if(ib) ib.addEventListener('input',function(){ b=parseFloat(ib.value); draw(); });
    if(ar) ar.addEventListener('input',function(){ area=parseFloat(ar.value); draw(); });
  }
  function r(x,d){ return +x.toFixed(d); }
  function draw(){
    if(!(sd>0)||!isFinite(mu)){ svg.innerHTML=''; out.innerHTML='Enter a mean and a standard deviation greater than 0.'; return; }
    var L=20,R=500,T=16,B=196,lo=mu-4*sd,hi=mu+4*sd;
    function X(x){ return L+(x-lo)/(hi-lo)*(R-L); }
    var peak=1/(sd*Math.sqrt(2*Math.PI));
    function Y(x){ var z=(x-mu)/sd; return B-(Math.exp(-z*z/2)/(sd*Math.sqrt(2*Math.PI)))/peak*(B-T); }
    function pathBetween(x1,x2){ x1=Math.max(lo,x1); x2=Math.min(hi,x2); if(x2<=x1) return ''; var d='M'+X(x1)+' '+B; for(var i=0;i<=120;i++){ var x=x1+(x2-x1)*i/120; d+=' L'+X(x).toFixed(1)+' '+Y(x).toFixed(1); } return '<path d="'+d+' L'+X(x2)+' '+B+' Z" class="shade"/>'; }
    var s='', valid=true, msg='', h='';
    var x1,x2,P,za,zb;
    if(mode==='inv'){
      if(!(area>0&&area<1)){ valid=false; msg='Enter an area between 0 and 1, such as 0.90 for the 90th percentile.'; }
      else { za=invPhi(area); x2=mu+za*sd; x1=-Infinity; }
    } else if(mode==='between'){
      if(!isFinite(a)||!isFinite(b)||a>=b){ valid=false; msg='Enter two values with the first one smaller.'; }
      else { x1=a; x2=b; za=(a-mu)/sd; zb=(b-mu)/sd; P=Phi(zb)-Phi(za); }
    } else {
      if(!isFinite(a)){ valid=false; msg='Enter a value for x.'; }
      else { za=(a-mu)/sd; if(mode==='left'){ x1=-Infinity; x2=a; P=Phi(za); } else { x1=a; x2=Infinity; P=1-Phi(za); } }
    }
    if(valid) s+=pathBetween(x1,x2);
    var d='M'+X(lo)+' '+Y(lo).toFixed(1); for(var i=1;i<=200;i++){ var x=lo+(hi-lo)*i/200; d+=' L'+X(x).toFixed(1)+' '+Y(x).toFixed(1); }
    s+='<path d="'+d+'" class="curve"/><line x1="'+L+'" y1="'+B+'" x2="'+R+'" y2="'+B+'" class="ax"/>';
    for(var kk=-3;kk<=3;kk++){ var xv=mu+kk*sd; s+='<line x1="'+X(xv)+'" y1="'+B+'" x2="'+X(xv)+'" y2="'+(B+5)+'" class="ax"/><text x="'+X(xv)+'" y="'+(B+19)+'" text-anchor="middle" class="tk">'+r(xv,2)+'</text><text x="'+X(xv)+'" y="'+(B+34)+'" text-anchor="middle" class="tk">z = '+kk+'</text>'; }
    if(emp){
      for(var j=-3;j<=3;j++){ if(j===0) continue; s+='<line x1="'+X(mu+j*sd)+'" y1="'+T+'" x2="'+X(mu+j*sd)+'" y2="'+B+'" class="emp"/>'; }
      s+='<line x1="'+X(mu)+'" y1="'+T+'" x2="'+X(mu)+'" y2="'+B+'" class="emp"/>';
      var labs=[[-0.5,'34%'],[0.5,'34%'],[-1.5,'13.5%'],[1.5,'13.5%'],[-2.5,'2.35%'],[2.5,'2.35%']];
      labs.forEach(function(l){ s+='<text x="'+X(mu+l[0]*sd)+'" y="'+(B-8)+'" text-anchor="middle" class="lg">'+l[1]+'</text>'; });
    }
    svg.innerHTML=s;
    if(!valid){ out.innerHTML=msg; return; }
    var nm='X ~ N('+r(mu,3)+', '+r(sd,3)+')';
    if(mode==='inv'){
      svg.setAttribute('aria-label','Normal curve with the lowest '+r(area*100,1)+' percent shaded');
      h='<div class="calc">'+nm+'. Area '+area+' to the left → z ≈ '+za.toFixed(3)+'</div><div class="calc">x = μ + zσ = '+r(mu,3)+' + ('+za.toFixed(3)+')('+r(sd,3)+') ≈ '+r(x2,2)+'</div><div>Calculator: invNorm(area = '+area+', μ = '+r(mu,3)+', σ = '+r(sd,3)+') ≈ '+r(x2,2)+'</div><div>About '+r(area*100,1)+'% of values are below '+r(x2,2)+', so '+r(x2,2)+' is the '+r(area*100,1)+'th percentile.</div>';
    } else if(mode==='between'){
      svg.setAttribute('aria-label','Normal curve shaded between '+a+' and '+b);
      h='<div class="calc">'+nm+'. P('+a+' &lt; X &lt; '+b+')</div><div class="calc">z = ('+a+' − '+r(mu,3)+') ÷ '+r(sd,3)+' ≈ '+za.toFixed(2)+' and z = ('+b+' − '+r(mu,3)+') ÷ '+r(sd,3)+' ≈ '+zb.toFixed(2)+'</div><div class="calc">P ≈ '+f4(Phi(zb))+' − '+f4(Phi(za))+' = '+f4(P)+'</div><div>Calculator: normalcdf(lower = '+a+', upper = '+b+', μ = '+r(mu,3)+', σ = '+r(sd,3)+')</div>';
    } else {
      svg.setAttribute('aria-label','Normal curve shaded '+(mode==='left'?'left':'right')+' of '+a);
      var sym=mode==='left'?'&lt;':'&gt;';
      h='<div class="calc">'+nm+'. P(X '+sym+' '+a+')</div><div class="calc">z = ('+a+' − '+r(mu,3)+') ÷ '+r(sd,3)+' ≈ '+za.toFixed(2)+', so P(Z '+sym+' '+za.toFixed(2)+') ≈ '+f4(P)+'</div><div>Calculator: normalcdf(lower = '+(mode==='left'?'−∞':a)+', upper = '+(mode==='left'?a:'∞')+', μ = '+r(mu,3)+', σ = '+r(sd,3)+')</div><div>About '+r(P*100,1)+'% of values are '+(mode==='left'?'less':'greater')+' than '+a+'.</div>';
    }
    out.innerHTML=h;
  }
  root.querySelectorAll('[data-m]').forEach(function(btn){ btn.addEventListener('click',function(){ mode=btn.dataset.m; root.querySelectorAll('[data-m]').forEach(function(x){ x.setAttribute('aria-pressed',x===btn?'true':'false'); }); bindBounds(); draw(); }); });
  root.querySelector('#nm-mu').addEventListener('input',function(e){ mu=parseFloat(e.target.value); draw(); });
  root.querySelector('#nm-sd').addEventListener('input',function(e){ sd=parseFloat(e.target.value); draw(); });
  root.querySelector('#nm-emp').addEventListener('change',function(e){ emp=e.target.checked; draw(); });
  bindBounds(); draw();
}
var WIDGETS={dist:widgetDist,transform:widgetTransform,combine:widgetCombine,binom:widgetBinom,normal:widgetNormal};

/* ---------- views ---------- */
/* view: 'home' | 'path' | topic key | 'mix' */
var state={path:null,view:'home',mode:'review'};
var main=document.getElementById('main'), rail=document.getElementById('rail');

function railHTML(){
  var h='<div class="rail-title">Review Hub<span>Unit 2b, AP Statistics</span></div><ul>';
  function item(v,n,t,path,prog){
    var cur=(state.view===v&&(path===undefined||state.path===path));
    return '<li><button class="rail-item" data-act="go" data-view="'+v+'"'+(path?' data-path="'+path+'"':'')+(cur?' aria-current="page"':'')+' aria-label="'+n+' '+t+'"><span class="rn">'+n+'</span><span class="rt">'+t+'</span><span class="rp"'+(prog?' data-prog="'+prog+'"':'')+'></span></button></li>';
  }
  h+=item('home','Home','Choose quiz or test');
  if(!state.path){
    h+=item('path','Quiz','Quiz prep: 2.8, 2.9, 2.11','quiz','path-quiz');
    h+=item('path','Test','Test prep: 2.8–2.11','test','path-test');
  } else {
    var P=PATHS[state.path];
    h+='<li class="rail-sub" aria-hidden="true">'+P.title+'</li>';
    h+=item('path',P.label,'Overview: '+P.range.replace('Topics ',''),state.path,'path-'+state.path);
    P.topics.forEach(function(k){ var t=TBYKEY[k]; h+=item(k,t.num,t.short,state.path,k); });
    h+=item('mix','Mix',P.mix.short,state.path,P.mix.key);
  }
  return h+'</ul>';
}
function refreshStatus(){
  TOPICS.concat([QUIZMIX,TESTMIX]).forEach(function(t){
    var st=stats(t,state.path);
    document.querySelectorAll('[data-prog="'+t.key+'"]').forEach(function(el){ el.textContent=st.done+'/'+st.total; });
    document.querySelectorAll('[data-hprog="'+t.key+'"]').forEach(function(hp){ hp.textContent=st.done+' of '+st.total+' answered'+(st.done?' · '+st.correct+' correct':''); });
  });
  ['quiz','test'].forEach(function(k){
    var ps=pathStats(PATHS[k]);
    document.querySelectorAll('[data-prog="path-'+k+'"]').forEach(function(el){ el.textContent=ps.done+'/'+ps.total; });
    document.querySelectorAll('[data-pprog="'+k+'"]').forEach(function(el){ el.textContent=ps.done+' of '+ps.total+' questions answered'+(ps.done?' · '+ps.correct+' correct':''); });
  });
  var cur=curSet(), s=document.getElementById('status');
  if(cur&&s){ var st2=stats(cur,state.path); s.querySelector('.txt').textContent=st2.done+' of '+st2.total+' answered · '+st2.correct+' correct'; s.querySelector('.bar i').style.width=(st2.done/st2.total*100)+'%'; }
}
function curSet(){
  if(state.view==='mix'&&state.path) return PATHS[state.path].mix;
  return TBYKEY[state.view]||null;
}
function homeHTML(){
  function card(k){
    var P=PATHS[k], all=['t28','t29','t210','t211'];
    var h='<button class="pathcard'+(k==='test'?' test':'')+'" data-act="go" data-view="path" data-path="'+k+'"><span class="kicker">'+P.title+'</span><h2>'+P.range+'</h2><ul>';
    all.forEach(function(t){ var T=TBYKEY[t], on=P.topics.indexOf(t)>=0; h+='<li class="'+(on?'':'off')+'"><b>'+T.num+'</b><span>'+T.short+(on?(k==='quiz'&&t==='t29'?' (mean and SD only)':''):' (not on the quiz)')+'</span></li>'; });
    h+='<li><b>Mix</b><span>'+P.mix.questions.length+' mixed questions</span></li></ul><span class="pp" data-pprog="'+k+'"></span><span class="go">Start '+P.label.toLowerCase()+' prep →</span></button>';
    return h;
  }
  var h='<div class="page"><h1 style="font-size:clamp(1.9rem,5vw,2.8rem);margin-bottom:6px">Review Hub: Unit 2b</h1>'+
   '<p class="home-lede">Random variables, the binomial distribution, and the normal distribution. Pick what you’re studying for. Each topic has a concept review, an interactive to try, and practice questions with explanations.</p>'+
   '<div class="paths">'+card('quiz')+card('test')+'</div>';
  h+='<div class="callout"><p><strong>Already studied for the quiz?</strong> Your answers on 2.8, 2.9, and 2.11 carry over to test prep. Pick up with transforming and combining in 2.9, then 2.10 and the test mixed review.</p></div>';
  h+='<p class="fine">Built from the AP Statistics Course and Exam Description, effective fall 2026 (Unit 2, topics 2.8–2.11). Your answers are saved only in this browser.</p>';
  h+='<p><button class="link" data-act="reset">Reset my answers</button></p></div>';
  return h;
}
function pathHTML(){
  var P=PATHS[state.path];
  var h='<div class="page"><span class="badge'+(state.path==='test'?' test':'')+'">'+P.title+'</span><h1 style="font-size:clamp(1.9rem,5vw,2.6rem);margin-bottom:6px">'+P.range+'</h1><p class="home-lede">'+P.lede+'</p><div class="rows">';
  P.topics.forEach(function(k){ var t=TBYKEY[k]; h+='<button class="row" data-act="go" data-view="'+t.key+'"><span class="big">'+t.num+'</span><span><h3>'+t.title+'</h3><p>'+(state.path==='quiz'&&t.blurbQuiz?t.blurbQuiz:t.blurb)+'</p></span><span class="prog" data-hprog="'+t.key+'"></span></button>'; });
  h+='<button class="row" data-act="go" data-view="mix"><span class="big">Mix</span><span><h3>'+P.mix.title+'</h3><p>'+(state.path==='quiz'?'Choose the right idea, then use 2.8, 2.9 (mean and SD), and 2.11 together.':'Choose between a distribution table, combining rules, binomial, and normal, then apply it.')+'</p></span><span class="prog" data-hprog="'+P.mix.key+'"></span></button></div>';
  h+='<div class="callout"><p><strong>Suggested order.</strong> Work through each topic’s concept review and practice, then finish with the mixed review. Mixed questions are closest to what you’ll see on the '+P.label.toLowerCase()+', because they don’t tell you which topic they come from.</p></div>';
  if(state.path==='quiz') h+='<p class="fine">Studying for the test instead? <button class="link" data-act="go" data-view="path" data-path="test">Switch to test prep</button></p>';
  else h+='<p class="fine">Only studying for the quiz? <button class="link" data-act="go" data-view="path" data-path="quiz">Switch to quiz prep</button></p>';
  return h+'</div>';
}
function topicHeader(t){
  var h='<header class="thead"><div class="tnum">'+t.num+'</div><div><h1>'+t.title+'</h1>';
  if(t.objectives){ h+='<ul class="objs">'+t.objectives.filter(function(o){ return !(state.path==='quiz'&&o.indexOf('TEST:')===0); }).map(function(o){ return o.indexOf('TEST:')===0?'<li><span class="tonly">Test only</span>'+o.slice(5)+'</li>':'<li>'+o+'</li>'; }).join('')+'</ul>'; }
  return h+'</div></header>';
}
function tabsHTML(t){
  return '<div class="tabs" role="group" aria-label="Section"><button data-act="mode" data-mode="review" aria-pressed="'+(state.mode==='review')+'">Concept review</button><button data-act="mode" data-mode="practice" aria-pressed="'+(state.mode==='practice')+'">Practice ('+qList(t,state.path).length+')</button></div>';
}
function statusHTML(){ return '<div class="status" id="status"><span class="txt"></span><span class="bar" aria-hidden="true"><i></i></span></div>'; }
function navHTML(t){
  var P=PATHS[state.path], list=P.topics, h='<div class="nav">';
  if(state.view==='mix') h+='<button class="btn ghost" data-act="go" data-view="path">Back to '+P.title.toLowerCase()+'</button>';
  else {
    var i=list.indexOf(t.key), prev=i>0?TBYKEY[list[i-1]]:null, next=i<list.length-1?TBYKEY[list[i+1]]:null;
    h+= prev?'<button class="btn ghost" data-act="go" data-view="'+prev.key+'">← '+prev.num+' '+prev.short+'</button>':'<button class="btn ghost" data-act="go" data-view="path">← '+P.title+'</button>';
    h+= next?'<button class="btn" data-act="go" data-view="'+next.key+'">'+next.num+' '+next.short+' →</button>':'<button class="btn" data-act="go" data-view="mix">Mixed review →</button>';
  }
  return h+'</div>';
}
function topicHTML(t){
  var h='<div class="page"><span class="badge'+(state.path==='test'?' test':'')+'">'+PATHS[state.path].title+'</span>'+topicHeader(t)+tabsHTML(t);
  if(state.mode==='review'){
    h+=t.review+'<div class="callout"><p><strong>Ready?</strong> Test yourself on '+t.num+'.</p><div class="btnrow"><button class="btn" data-act="mode" data-mode="practice">Go to practice</button></div></div>';
  } else {
    h+=statusHTML()+'<p class="fine">Answer each question, then read the explanation. For written questions, write first, then compare with the model answer.</p>';
    qList(t,state.path).forEach(function(q,i){ h+=qHTML(q,i+1); });
  }
  return h+navHTML(t)+'</div>';
}
function mixedHTML(){
  var P=PATHS[state.path], M=P.mix;
  var h='<div class="page"><span class="badge'+(state.path==='test'?' test':'')+'">'+P.title+'</span><header class="thead"><div class="tnum">Mix</div><div><h1>'+M.title+'</h1><ul class="objs"><li>'+P.range+' together. Decide which idea fits, then apply it.</li></ul></div></header>'+statusHTML();
  M.questions.forEach(function(q,i){ h+=qHTML(q,i+1); });
  return h+navHTML(M)+'</div>';
}
function render(scroll){
  rail.innerHTML=railHTML();
  if(state.view==='home'||!state.path) main.innerHTML=homeHTML();
  else if(state.view==='path') main.innerHTML=pathHTML();
  else if(state.view==='mix') main.innerHTML=mixedHTML();
  else main.innerHTML=topicHTML(TBYKEY[state.view]);
  main.querySelectorAll(state.path==='quiz'?'.test-only':'.quiz-only').forEach(function(e){ e.remove(); });
  main.querySelectorAll('[data-widget]').forEach(function(w){ var f=WIDGETS[w.dataset.widget]; if(f) f(w); });
  refreshStatus();
  if(scroll!==false){ window.scrollTo(0,0); try{ main.focus({preventScroll:true}); }catch(e){} }
}
function commit(qid,noFocus){
  saveProgress();
  var item=QINDEX[qid], art=document.getElementById('q-'+qid);
  if(art){ art.outerHTML=qHTML(item.q,qList(item.set,state.path).indexOf(item.q)+1); }
  refreshStatus();
  var na=document.getElementById('q-'+qid); if(!na) return;
  var fb=na.querySelector('.fb'); try{ (fb&&!noFocus?fb:na).focus({preventScroll:true}); }catch(e){}
}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]'); if(!t) return;
  var act=t.dataset.act, qid=t.dataset.qid;
  if(act==='go'){
    var v=t.dataset.view;
    if(v==='home'){ state.path=null; }
    else if(t.dataset.path){ state.path=t.dataset.path; }
    state.view=v; state.mode='review'; render();
  }
  else if(act==='mode'){ state.mode=t.dataset.mode; render(false); var tb=main.querySelector('.tabs'); if(tb) tb.scrollIntoView(); }
  else if(act==='pick'){ var i=+t.dataset.i, q=QINDEX[qid].q; progress[qid]={choice:i,correct:i===q.correct}; commit(qid); }
  else if(act==='retry'){ delete progress[qid]; commit(qid,true); }
  else if(act==='reveal'){ var ta=document.getElementById('ta-'+qid); progress[qid]={revealed:true,text:ta?ta.value:''}; commit(qid); }
  else if(act==='self'){ progress[qid]=Object.assign({},progress[qid],{self:t.dataset.v}); commit(qid); }
  else if(act==='reset'){
    if(t.dataset.armed){ progress={}; saveProgress(); render(); }
    else { t.dataset.armed='1'; t.textContent='Click again to erase all my answers'; }
  }
});
render(false);
})();
</script>
